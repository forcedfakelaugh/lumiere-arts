<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>V03 typography plates</title>
<style>
@font-face{font-family:Editorial;src:url('assets/editorial-serif.woff2')}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
.plate{position:absolute;inset:0;display:none;color:#fff8e9;font-family:Editorial,serif;font-weight:400;line-height:1;letter-spacing:-8px}
.word{position:absolute;left:0;width:1080px;text-align:center;margin:0;font-weight:400}
#opening-a .word{top:338px;font-size:304px}
#opening-b .word{top:754px;font-size:314px}
#signature-a .word{top:320px;font-size:350px}
#signature-b .word{top:825px;font-size:284px;letter-spacing:-7px}
</style></head>
<body>
<div class="plate" id="opening-a"><p class="word">VÙNG</p></div>
<div class="plate" id="opening-b"><p class="word">SỐNG</p></div>
<div class="plate" id="signature-a"><p class="word">NÉT</p></div>
<div class="plate" id="signature-b"><p class="word">RIÊNG</p></div>
<script>document.getElementById(new URLSearchParams(location.search).get('plate')||'opening-a').style.display='block';</script>
</body></html>
